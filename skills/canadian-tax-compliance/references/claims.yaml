  - id: tax-remittance-thresholds
    statement: "Payroll remitter type thresholds by Average Monthly Withholding Amount"
    value: "Quarterly new small employer MWA under $1,000; quarterly small employer under $3,000; Regular under $25,000 (monthly, 15th); Accelerated Threshold 1 $25,000–$99,999.99; Accelerated Threshold 2 $100,000 or more. AMWA generally based on remittances from two calendar years ago."
    where: "SKILL.md — Remittance Schedules"
    source: "https://www.canada.ca/en/revenue-agency/services/tax/businesses/topics/payroll/remitting-source-deductions.html"
