  - id: tax-late-remittance-penalty
    statement: "Penalty for late payroll remittance"
    value: "3% (1–3 days late), 5% (4–5 days), 7% (6–7 days), 10% (more than 7 days or no amount remitted); generally applied only to the portion of the failure exceeding $500; 20% for a second or later failure in the same calendar year made knowingly or with gross negligence; 3% for remitting on the due date but not at a financial institution"
    where: "SKILL.md — Remittance Schedules (Penalty for late remittance)"
    source: "https://www.canada.ca/en/revenue-agency/services/tax/businesses/topics/payroll/remitting-source-deductions.html"
    verified: 2026-09-11
    review_by: 2027-03-11
    cadence: annual
    notes: "source URL unconfirmed"

