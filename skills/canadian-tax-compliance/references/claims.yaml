  - id: tax-small-business-rates-2026
    statement: "Small business income tax rates, federal and selected provinces (2026)"
    value: "Federal 9% on first $500K active income; Ontario 3.2% falling to 2.2% on July 1, 2026 (2.70% calendar-2026 blended); BC 2%; Alberta 2%. Combined small business approx. Ontario 12.2% falling to 11.2% after July 1, 2026; BC 11%; Alberta 11%."
