  - id: tax-sbd-grinds
    statement: "Small business deduction grind thresholds"
    value: "Taxable capital grind: straight-line reduction between $10M and $50M taxable capital employed in Canada (associated-group basis), nil at $50M. Passive investment income grind: $5 reduction for every $1 of adjusted aggregate investment income above $50,000, nil at $150,000. Ontario and New Brunswick do not parallel the passive-income grind provincially."
    where: "SKILL.md — Corporate Income Tax, Small business deduction"
    source: "https://www.canada.ca/en/revenue-agency/services/tax/businesses/topics/corporations/corporation-tax-rates.html"
    verified: 2026-09-11
