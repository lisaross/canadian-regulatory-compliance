    statement: "Penalty for late-filed information returns (T4/T5), by number of slips"
    value: "Greater of $100 and a per-day amount, max 100 days, per type of return — 1–50: $10/day (max $1,000) · 51–500: $15/day (max $1,500) · 501–2,500: $25/day (max $2,500) · 2,501–10,000: $50/day (max $5,000) · 10,001+: $75/day (max $7,500). Paper filing more than 5 slips of one type: $125–$2,500."
