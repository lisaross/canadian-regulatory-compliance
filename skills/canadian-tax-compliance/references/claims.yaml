    statement: "Record of Employment filing deadlines"
    value: "Electronic ROEs due 5 calendar days after the end of the pay period in which the interruption of earnings occurs (monthly or 13-period payrolls: earlier of that date or 15 calendar days after the first day of interruption); paper ROEs due within 5 calendar days of the interruption or of becoming aware of it"
