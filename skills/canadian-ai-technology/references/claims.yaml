  - id: ai-competition-c59-drip-pricing
    statement: "Competition Act Bill C-59 amendments relevant to AI marketing"
    value: "Drip pricing deemed false or misleading unless the mandatory fee is imposed by an Act of Parliament or a province; private access to the Competition Tribunal extended to deceptive marketing practices with an eased leave test. In force"
    where: "SKILL.md — AI in Marketing and Pricing"
    source: "https://competition-bureau.canada.ca/en/how-we-foster-competition/education-and-outreach/guide-june-2024-amendments-competition-act"
    verified: 2026-09-11
    review_by: 2027-03-11
    cadence: on-event
    notes: "Skill states the C-59 deceptive-marketing private access is in force; the statute phased provisions in on different dates — confirm the applicable date on review. No dollar penalty figure for AI-washing is stated in the skill."

  - id: ai-competition-annual-plan
    statement: "Competition Bureau treatment of AI as an enforcement priority"
    value: "AI is a named priority in the 2025-26 Annual Plan; the Bureau's position is that it does not need a new AI statute"
    where: "SKILL.md — AI in Marketing and Pricing"
    source: "https://competition-bureau.canada.ca/sites/default/files/documents/Policy-Submission-on-Competition-and-AI--FINAL.pdf"
