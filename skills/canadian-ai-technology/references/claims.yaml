  - id: ai-openai-findings-date
    statement: "OPC + CAI + OIPC-BC + OIPC-AB joint OpenAI/ChatGPT investigation findings"
    value: "Findings issued 6 May 2026 (PIPEDA-2026-002). Well-founded and conditionally resolved federally; well-founded and unresolved at OIPC-BC and at the CAI. OpenAI retired the offending models, deployed a PII filtering tool, and reports quarterly to the regulators"
    where: "SKILL.md — Privacy Regulators as AI Enforcers"
    source: "https://www.priv.gc.ca/en/opc-actions-and-decisions/investigations/investigations-into-businesses/2026/pipeda-2026-002/"
    verified: 2026-09-11
    review_by: 2027-03-11
    cadence: quarterly
    notes: "Unresolved BC and Quebec branches may produce further orders or findings; OpenAI's quarterly reporting is an ongoing event stream."

