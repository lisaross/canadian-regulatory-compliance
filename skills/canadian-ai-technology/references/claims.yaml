  - id: ai-ontario-esa-84-in-force
    statement: "Ontario ESA s.8.4 AI hiring disclosure in-force date and threshold"
    value: "In force 1 January 2026; employers with 25+ employees; applies to every publicly advertised job posting; O. Reg. 476/24 defines AI on an OECD-style inference-based test"
    where: "SKILL.md — AI in Employment / Ontario ESA s.8.4"
    source: "http://www.ontario.ca/document/your-guide-employment-standards-act-0/requirements-related-publicly-advertised-job"
    verified: 2026-09-11
    review_by: 2027-03-11
    cadence: on-event

  - id: ai-ontario-ministry-guidance-date
    statement: "Ontario Ministry guidance on ESA s.8.4 AI disclosure"
    value: "Guidance dated 4 February 2026 — a bare statement suffices; no detailed description of the system is required"
    where: "SKILL.md — AI in Employment / Ontario ESA s.8.4"
    source: "https://www.ontario.ca/document/your-guide-employment-standards-act-0/recent-changes"
