  - id: ai-incident-clock-matrix
    statement: "Four-regime incident clock matrix"
    value: "CCSPA <=72h to CSE (may-interfere threshold, not in force); PIPEDA as soon as feasible to OPC and individuals (RROSH); OSFI 24h (technology or cyber incident); Quebec Law 25 promptly to CAI and individuals (risk of serious injury, no fixed deadline)"
    where: "references/ai-technology-details.md — §2 Incident-Clock Reconciliation"
    source: "https://laws.justice.gc.ca/eng/AnnualStatutes/2026_9/page-1.html"
    verified: 2026-09-11
    review_by: 2026-12-10
    cadence: on-event
    notes: "The CCSPA row changes the moment Part 2 is proclaimed."

