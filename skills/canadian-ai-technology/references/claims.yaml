  - id: ai-ccspa-incident-deadline
    statement: "CCSPA cyber incident reporting deadline"
    value: "Report to the Communications Security Establishment within a period not exceeding 72 hours (hard ceiling; the exact period is to be set by regulation), then immediately notify the sector regulator with a copy"
    where: "SKILL.md — Cybersecurity; references/ai-technology-details.md — §2 Incident-Clock Reconciliation"
    source: "https://laws.justice.gc.ca/eng/AnnualStatutes/2026_9/page-1.html"
    verified: 2026-09-11
    review_by: 2026-12-10
    cadence: on-event
    notes: "The specific period within the 72-hour ceiling is a pending regulation."

