skill: canadian-employment-labour
last_verified: 2026-09-11
claims:
  - id: empl-min-wage-federal
    statement: "Federal minimum wage (Canada Labour Code)"
    value: "$18.15/hr effective 1 Apr 2026; next scheduled change 1 Apr 2027 (annual CPI indexation)"
    where: "SKILL.md — Minimum Wage"
    source: "https://www.canada.ca/en/employment-social-development/programs/employment-standards/federal-standards/minimum-wage.html"
    verified: 2026-09-11
    review_by: 2027-04-01
    cadence: annual
    notes: "Indexed to CPI each 1 April; federally regulated employers must pay the higher of this and the provincial rate where the employee works."

  - id: empl-min-wage-ontario
    statement: "Ontario general minimum wage"
    value: "$17.60/hr effective 1 Oct 2025; announced increase to $17.95/hr on 1 Oct 2026"
    where: "SKILL.md — Minimum Wage"
    source: "https://www.ontario.ca/document/your-guide-employment-standards-act-0/minimum-wage"
    verified: 2026-09-11
    review_by: 2026-10-01
    cadence: annual
    notes: "Changes each 1 October; the $17.95 rate is announced but not yet in force at time of verification."

  - id: empl-min-wage-bc
    statement: "British Columbia general minimum wage"
    value: "$18.25/hr effective 1 Jun 2026; next scheduled change 1 Jun 2027 (annual BC CPI indexation)"
    where: "SKILL.md — Minimum Wage"
    source: "https://www2.gov.bc.ca/gov/content/employment-business/employment-standards-advice/employment-standards/wages/minimum-wage"
    verified: 2026-09-11
    review_by: 2027-06-01
