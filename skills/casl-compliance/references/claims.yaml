  - id: casl-s66-consent-exceptions
    statement: "CASL s.6(6) — messages where consent is not required but s.6(2) identification and unsubscribe still apply"
    value: "Messages that solely: provide a requested quote or estimate; facilitate/complete/confirm a previously agreed transaction; provide warranty, recall, safety or security information; give factual notice about an ongoing subscription, membership, account or loan; provide information about a current employment relationship or benefit plan; deliver a product, goods or service owed under a prior transaction"
    where: "SKILL.md — What is a Commercial Electronic Message (CEM)?"
    source: "https://laws-lois.justice.gc.ca/eng/acts/E-1.6/"
    verified: 2026-09-11
    review_by: 2027-03-11
    cadence: on-event

  - id: casl-s65-full-exclusions
    statement: "CASL s.6(5) and GIC Regs SOR/2013-221 s.3 — messages to which section 6 does not apply at all"
    value: "Personal or family relationship (s.6(5)(a)); inquiry about commercial activity (s.6(5)(b)); internal and inter-organization business communications (s.3(a)); responses to a request, inquiry, complaint or otherwise solicited (s.3(b)); messages satisfying a legal obligation, right, court order, judgment or tariff (s.3(c)); registered charity fundraising (s.3(g)); political contribution solicitation (s.3(h))"
    where: "SKILL.md — What is a Commercial Electronic Message (CEM)?"
    source: "https://laws-lois.justice.gc.ca/eng/regulations/SOR-2013-221/"
    verified: 2026-09-11
    review_by: 2027-03-11
    cadence: on-event
    notes: "Exemption list is set by Governor in Council regulation and can be amended without amending CASL itself."

  - id: casl-referral-exemption
    statement: "Referral exemption — SOR/2013-221 s.4(1)"
    value: "Consent under s.6(1) does not apply to the FIRST CEM sent as a result of a referral, where the referrer has an existing business, existing non-business, family or personal relationship with both sender and recipient; the CEM must disclose the referrer's full name and state it is sent as a result of a referral; identification and unsubscribe still apply"
    where: "references/casl-details.md — Sector-Specific Nuances / Referral and 'Forward to a Friend' Programs"
    source: "https://laws-lois.justice.gc.ca/eng/regulations/SOR-2013-221/"
    verified: 2026-09-11
    review_by: 2027-03-11
    cadence: on-event

  - id: casl-s9-aiding
    statement: "CASL s.9 liability for aiding a contravention"
    value: "It is a violation to aid, induce, procure or cause to be procured a contravention of ss.6-8; each participant's exposure turns on actual conduct and the facts"
    where: "references/casl-details.md — Sector-Specific Nuances / Referral and 'Forward to a Friend' Programs"
    source: "https://laws-lois.justice.gc.ca/eng/acts/E-1.6/"
    verified: 2026-09-11
    review_by: 2027-03-11
    cadence: on-event

  - id: casl-withdrawal-class-specific
    statement: "Scope of a consent withdrawal (s.11(1)(a))"
    value: "A recipient may withdraw from all CEMs or from a specified class of CEMs; a class-specific withdrawal does not bar all CEMs to that address"
    where: "SKILL.md — The Three Requirements for a Compliant CEM / 3. Unsubscribe Mechanism"
    source: "https://laws-lois.justice.gc.ca/eng/acts/E-1.6/"
    verified: 2026-09-11
    review_by: 2027-03-11
    cadence: on-event

  - id: casl-enforcement-agencies
    statement: "Agencies with CASL enforcement authority"
    value: "CRTC, Competition Bureau, OPC — enforcement is exclusively public while the private right of action remains suspended"
    where: "SKILL.md — Penalties and Enforcement"
    source: "https://www.fightspam.gc.ca/"
    verified: 2026-09-11
    review_by: 2027-03-11
    cadence: on-event
    notes: "source URL unconfirmed"

  - id: casl-rubric-scoring-bands
    statement: "Internal campaign review rubric score bands"
    value: "90-100 compliant, proceed; 70-89 compliant with minor gaps, fix before sending; below 70 non-compliant, do not send"
    where: "references/casl-details.md — Campaign Review Rubric, Score interpretation"
    source: "https://crtc.gc.ca/eng/internet/anti.htm"
    verified: 2026-09-11
    review_by: 2027-03-11
    cadence: on-event
    notes: "source URL unconfirmed. Internal scoring aid, not a CRTC standard; maintained in-skill and revised when the underlying CASL requirements change."

  - id: casl-complaint-response-window
    statement: "Recommended immediate-response window on a CRTC inquiry or complaint"
    value: "24-48 hours — preserve records, identify messages and recipients, pull consent records, check unsubscribe processing, notify counsel"
    where: "references/casl-details.md — CRTC Complaint Response Guidance / Immediate Steps"
    source: "https://crtc.gc.ca/eng/internet/anti.htm"
    verified: 2026-09-11
    review_by: 2027-03-11
    cadence: on-event
    notes: "source URL unconfirmed. Practice guidance rather than a statutory deadline."
